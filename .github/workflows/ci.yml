name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: adivina
          POSTGRES_PASSWORD: adivina
          POSTGRES_DB: adivina
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adivina -d adivina"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://adivina:adivina@localhost:5432/adivina
      DATABASE_URL_UNPOOLED: postgresql://adivina:adivina@localhost:5432/adivina
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `postinstall` ejecuta `prisma generate`.
      - run: npm ci

      - name: Migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build
