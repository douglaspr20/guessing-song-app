name: Vercel

# Vercel avisa a GitHub de cada despliegue con un estado del commit llamado «Vercel»
# (no crea «deployments» de GitHub, así que el evento `deployment_status` nunca llega).
# Este workflow escucha ese estado y publica en el mismo commit el check «Despliegue en Vercel»:
# verde si Vercel desplegó, rojo si falló.
# (Los workflows de `status` se leen desde la rama por defecto.)
on:
  status:

permissions:
  contents: read
  statuses: write

jobs:
  deploy:
    name: Despliegue en Vercel
    # Solo estados finales del contexto «Vercel»: «pending» aún no dice nada.
    if: github.event.context == 'Vercel' && contains(fromJSON('["success", "failure", "error"]'), github.event.state)
    runs-on: ubuntu-latest
    steps:
      - name: Publicar el estado en el commit desplegado
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.sha }}
          STATE: ${{ github.event.state }}
          LOG_URL: ${{ github.event.target_url }}
          DESCRIPTION: ${{ github.event.description }}
        run: |
          gh api -X POST "repos/$REPO/statuses/$SHA" \
            -f state="$STATE" \
            -f context="Despliegue en Vercel" \
            -f description="${DESCRIPTION:0:140}" \
            -f target_url="$LOG_URL"
          {
            echo "## Despliegue en Vercel: $STATE"
            echo
            echo "- Commit: $SHA"
            [ -n "$LOG_URL" ] && echo "- Registro: $LOG_URL"
            [ -n "$DESCRIPTION" ] && echo "- $DESCRIPTION"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$STATE" != "success" ]; then
            echo "::error::Vercel terminó el despliegue con estado $STATE ($LOG_URL)"
            exit 1
          fi
